3">IR</text><text x="12" y="44" font-family="ZE Mono" font-size="11" fill="#C3D6E0">Pred CommandLine</text><text x="12" y="60" font-family="ZE Mono" font-size="11" fill="#C3D6E0">  Str *-enc*  ci</text><text x="12" y="76" font-family="ZE Mono" font-size="11" fill="#C3D6E0">weight 1</text></g></g><text x="289" y="287" font-family="ZE Mono" font-size="11.5" fill="#7F93A3">2 · Compile</text><g transform="translate(500 98) scale(0.910)"><ellipse cx="95.0" cy="148" rx="93.50000000000001" ry="9" fill="#000" opacity=".55" filter="url(#wBlur)"/><polygon points="0,0 170,-26 170,94 0,120" fill="#9BF6FF" fill-opacity=".035" stroke="#55687A" stroke-width="1.2"/><polygon points="0,0 170,-26 170,94 0,120" fill="#9BF6FF" stroke="#9BF6FF" stroke-width="1.6" filter="url(#wGlow)" opacity=".55" fill-opacity=".05"></polygon><line x1="4" y1="6" x2="166" y2="-20" stroke="#fff" stroke-opacity=".08" stroke-width="2"/><g transform="matrix(1 -0.1529 0 1 0 0)"><text x="12" y="22" font-family="ZE Mono" font-size="10" fill="#7F93A3">Event</text><text x="12" y="44" font-family="ZE Mono" font-size="11" fill="#C3D6E0">4688 powershell.exe</text><text x="12" y="60" font-family="ZE Mono" font-size="11" fill="#C3D6E0">  -nop -w hidden</text><text x="12" y="76" font-family="ZE Mono" font-size="11" fill="#C3D6E0">  -enc SQBFAFgA...</text></g></g><text x="504" y="255" font-family="ZE Mono" font-size="11.5" fill="#7F93A3">3 · Match</text><g transform="translate(715 72) scale(0.865)"><ellipse cx="95.0" cy="148" rx="93.50000000000001" ry="9" fill="#000" opacity=".55" filter="url(#wBlur)"/><polygon points="0,0 170,-26 170,94 0,120" fill="#9BF6FF" fill-opacity=".035" stroke="#55687A" stroke-width="1.2"/><polygon points="0,0 170,-26 170,94 0,120" fill="#9BF6FF" stroke="#9BF6FF" stroke-width="1.6" filter="url(#wGlow)" opacity=".55" fill-opacity=".05"></polygon><line x1="4" y1="6" x2="166" y2="-20" stroke="#fff" stroke-opacity=".08" stroke-width="2"/><g transform="matrix(1 -0.1529 0 1 0 0)"><text x="12" y="22" font-family="ZE Mono" font-size="10" fill="#7F93A3">Finding</text><text x="12" y="44" font-family="ZE Mono" font-size="11" fill="#C3D6E0">OCSF class 2004</text><text x="12" y="60" font-family="ZE Mono" font-size="11" fill="#C3D6E0">severity high</text><text x="12" y="76" font-family="ZE Mono" font-size="11" fill="#C3D6E0">T1059.001</text></g></g><text x="719" y="224" font-family="ZE Mono" font-size="11.5" fill="#7F93A3">4 · Emit</text><g><g><line x1="912" y1="70" x2="912" y2="226" stroke="#E6D3A3" stroke-dasharray="2 3"/><path d="M842 226 h104 v28 h-104 l-10 -14 z" fill="#E6D3A3"/><circle cx="850" cy="240" r="2.6" fill="#0A0D12"/><text x="860" y="244" font-family="ZE Mono" font-size="11" font-weight="500" fill="#2A2116">evidence</text></g></g>
