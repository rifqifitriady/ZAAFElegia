spec_ref: sigma-appendix-modifiers.md#specific-modifiers (fieldref)
description: '`fieldref` compares two fields of the same event; the comparison is case-insensitive like every other string, and it combines with at most one of `contains`, `startswith` or `endswith`, and with `neq` (the neq rule requires a different value; its other field is guarded by `exists` so a missing field is not pinned). A `startswith`/`endswith` reference value that occurs only in the middle of the field does not match. A missing field never matches a positive `fieldref`.'
expected:
  - [c018-contains, c018-ends, c018-eq, c018-starts]
  - [c018-neq]
  - []
  - [c018-eq]
