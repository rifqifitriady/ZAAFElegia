spec_ref: sigma-appendix-modifiers.md#time-modifiers
description: 'Time modifiers extract a number from a `Z` (UTC) timestamp value; they combine with numeric comparisons. Unparseable values never match. Timestamps with offsets or other formats are unspecified by Sigma (the modifiers are not designed to convert time zones or formats), so this suite does not pin them.'
